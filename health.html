<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{a}OS Explorer — System Health</title>
    <meta
      name="description"
      content="Live observability scores for the {a}OS Explorer stack. Updated after each upgrade."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-base: rgb(8, 10, 12);
        --bg-card: rgb(14, 16, 20);
        --bg-elevated: rgb(24, 26, 34);
        --border: rgba(255, 255, 255, 0.06);
        --border-hover: rgba(255, 255, 255, 0.12);
        --text-primary: rgba(255, 255, 255, 0.9);
        --text-secondary: rgba(255, 255, 255, 0.6);
        --text-tertiary: rgba(255, 255, 255, 0.4);
        --accent-indigo: #818cf8;
        --accent-blue: #60a5fa;
        --green: #4ade80;
        --yellow: #facc15;
        --red: #f87171;
        --glow-indigo: rgba(129, 140, 248, 0.15);
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        background: var(--bg-base);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ── aurora bg ─────────────────────────────────── */
      .aurora {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .aurora-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.06;
        animation: drift 20s ease-in-out infinite;
      }
      .aurora-blob:nth-child(1) {
        width: 600px;
        height: 600px;
        background: #818cf8;
        top: -200px;
        left: -100px;
        animation-delay: 0s;
      }
      .aurora-blob:nth-child(2) {
        width: 500px;
        height: 500px;
        background: #22d3ee;
        top: 40%;
        right: -150px;
        animation-delay: -8s;
      }
      .aurora-blob:nth-child(3) {
        width: 400px;
        height: 400px;
        background: #4ade80;
        bottom: -100px;
        left: 40%;
        animation-delay: -4s;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(30px, -20px) scale(1.05);
        }
        66% {
          transform: translate(-20px, 15px) scale(0.95);
        }
      }

      /* ── layout ────────────────────────────────────── */
      .content {
        position: relative;
        z-index: 1;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }

      /* ── header ────────────────────────────────────── */
      .page-header {
        margin-bottom: 48px;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-tertiary);
        text-decoration: none;
        font-size: 13px;
        margin-bottom: 24px;
        transition: color 0.2s;
      }
      .back-link:hover {
        color: var(--accent-indigo);
      }
      .page-title {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }
      .page-subtitle {
        font-size: 15px;
        color: var(--text-secondary);
      }
      .updated-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-tertiary);
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 4px 12px;
        margin-top: 16px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }
      .dot.stale {
        background: var(--yellow);
      }

      /* ── suite cards ───────────────────────────────── */
      .suites-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 48px;
      }
      .suite-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        cursor: default;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .suite-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 0 24px var(--glow-indigo);
      }
      .suite-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .suite-name {
        font-size: 16px;
        font-weight: 600;
      }
      .suite-repo {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 4px;
        font-family: monospace;
      }
      .score-ring {
        width: 72px;
        height: 72px;
        position: relative;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .score-ring svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }
      .score-ring-track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.06);
        stroke-width: 5;
      }
      .score-ring-fill {
        fill: none;
        stroke-width: 5;
        stroke-linecap: round;
        transition: stroke-dashoffset 1s ease;
      }
      .score-text {
        font-size: 18px;
        font-weight: 700;
        position: relative;
        z-index: 1;
      }
      .score-grade {
        font-size: 11px;
        color: var(--text-tertiary);
        text-align: center;
        margin-top: 4px;
      }

      /* ── delta badge ───────────────────────────────── */
      .delta-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        border-radius: 6px;
        padding: 3px 8px;
        font-weight: 500;
        margin-top: 8px;
      }
      .delta-up {
        background: rgba(74, 222, 128, 0.12);
        color: var(--green);
      }
      .delta-down {
        background: rgba(248, 113, 113, 0.12);
        color: var(--red);
      }
      .delta-flat {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-tertiary);
      }

      /* ── probe table ───────────────────────────────── */
      .probe-list {
        list-style: none;
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .probe-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        padding: 8px 10px;
        background: var(--bg-elevated);
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      .probe-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .probe-id {
        font-family: monospace;
        font-size: 12px;
        color: var(--text-secondary);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .probe-val {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-left: auto;
        white-space: nowrap;
      }
      .probe-score {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
        min-width: 36px;
        text-align: center;
      }
      .ok-true .probe-score {
        background: rgba(74, 222, 128, 0.1);
        color: var(--green);
      }
      .ok-false .probe-score {
        background: rgba(248, 113, 113, 0.1);
        color: var(--red);
      }

      /* ── no-data state ─────────────────────────────── */
      .no-data {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 48px 24px;
        text-align: center;
        color: var(--text-tertiary);
        font-size: 14px;
      }
      .no-data pre {
        margin-top: 16px;
        font-size: 12px;
        color: var(--accent-indigo);
        background: var(--bg-elevated);
        padding: 12px 16px;
        border-radius: 8px;
        text-align: left;
        display: inline-block;
      }

      /* ── section heading ───────────────────────────── */
      .section-heading {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="aurora">
      <div class="aurora-blob"></div>
      <div class="aurora-blob"></div>
      <div class="aurora-blob"></div>
    </div>

    <div class="content">
      <div class="page-header">
        <a href="index.html" class="back-link">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
          {a}OS Explorer
        </a>
        <h1 class="page-title">System Health</h1>
        <p class="page-subtitle">
          Observability scores across the Codepro stack. Run after every upgrade
          to prove real progress.
        </p>
        <div id="updated-badge" class="updated-badge">
          <span class="dot" id="freshness-dot"></span>
          <span id="updated-text">Loading…</span>
        </div>
      </div>

      <p class="section-heading">Benchmark Suites</p>
      <div id="suites-grid" class="suites-grid"></div>
    </div>

    <script src="js/health.js"></script>
  </body>
</html>
